<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>linked-data-graph-prototype</title>
  <link rel="stylesheet" href="/src/style.css">
</head>

<body>
  <div id="app">
    <dialog id="tooltip" popover closedby="any">
      <div class="tooltip-container">
      </div>
    </dialog>

    <form action="" class="input-container" onSubmit="return false">
      <label for="apiUrlField">Enter URL for Museum Collection API :</label>
      <input id="apiUrlField" type="text" placeholder="https://data.getty.edu/museum/collection/..." />
      <span class="input-error"></span>
      <button id="getRecordsButton" type="button">Get Records</button>
    </form>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
